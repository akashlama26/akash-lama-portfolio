<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Journal Admin — Akash Lama</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#11110f;--panel:#191916;--paper:#e9e5da;--muted:#aaa69b;--line:rgba(233,229,218,.18);--acid:#d6ed68;--mono:"DM Mono",monospace;--sans:"DM Sans",sans-serif;--serif:"Playfair Display",serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--sans)}.wrap{width:min(900px,calc(100% - 36px));margin:50px auto}.mono{font:11px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}h1{font:italic 500 clamp(42px,7vw,68px) var(--serif);margin:12px 0 8px}p{color:var(--muted);line-height:1.6}.panel{background:var(--panel);border:1px solid var(--line);padding:24px;margin:24px 0}label{display:block;font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}input,textarea,select{width:100%;padding:13px;background:#10100e;color:var(--paper);border:1px solid var(--line);font:14px var(--sans)}textarea{min-height:280px;resize:vertical;line-height:1.7}button{background:var(--acid);color:#171711;border:0;padding:12px 17px;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;margin:12px 8px 0 0}button.secondary{background:transparent;color:var(--paper);border:1px solid var(--line)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}.post{border-top:1px solid var(--line);padding:16px 0;display:flex;gap:14px;align-items:center;justify-content:space-between}.hidden{display:none!important}#message{white-space:pre-wrap;color:var(--acid)}a{color:var(--acid)}
</style></head><body><main class="wrap">
<div class="mono">Akash Lama / Private area</div><h1>Journal desk.</h1><p>Write, save drafts, and publish journal entries to your public portfolio.</p>
<section id="loginPanel" class="panel"><h2>Sign in</h2><p>Enter your portfolio email. Supabase will send you a secure sign-in link.</p><label for="email">Email address</label><input id="email" type="email" value="akashlama26@gmail.com" autocomplete="email"><button id="sendLink">Send sign-in link</button><p id="loginMessage"></p></section>
<section id="appPanel" class="hidden"><div class="row"><p id="signedInAs"></p><button class="secondary" id="signOut">Sign out</button></div>
<div class="panel"><div class="row"><h2 id="formHeading">New journal entry</h2><button class="secondary" id="newPost">New entry</button></div>
<input type="hidden" id="postId"><label for="title">Title</label><input id="title" maxlength="180" placeholder="Article title">
<label for="slug">URL slug</label><input id="slug" maxlength="180" placeholder="article-title">
<label for="excerpt">Short introduction</label><textarea id="excerpt" style="min-height:90px" placeholder="A short summary for the Journal page"></textarea>
<label for="content">Article</label><textarea id="content" placeholder="Write your journal entry here…"></textarea>
<label for="cover">Cover image URL (optional)</label><input id="cover" type="url" placeholder="https://…">
<label for="status">Status</label><select id="status"><option value="draft">Save as draft</option><option value="published">Publish</option></select>
<div class="row"><button id="savePost">Save entry</button><span id="message"></span></div></div>
<div class="panel"><h2>Your entries</h2><div id="postsList">Loading…</div></div></section>
<p class="mono"><a href="/">← Return to portfolio</a></p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://jofagddegqwsaeqtaoyn.supabase.co", SUPABASE_PUBLISHABLE_KEY="sb_publishable_g7H7cwfVzBtsVqED0XeOjg_X3gR6ScD", ADMIN_EMAIL="akashlama26@gmail.com";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY), $=id=>document.getElementById(id), say=m=>$("message").textContent=m;
function slugify(s){return s.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
$("title").addEventListener("input",()=>{if(!$("postId").value)$("slug").value=slugify($("title").value)});
$("sendLink").onclick=async()=>{ $("loginMessage").textContent="Sending sign-in link…";const email=$("email").value.trim().toLowerCase();if(email!==ADMIN_EMAIL){$("loginMessage").textContent="This email is not authorized.";return}const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+"/admin.html"}});$("loginMessage").textContent=error?error.message:"Check your inbox for the secure sign-in link."};
async function refreshSession(){const {data:{session}}=await client.auth.getSession(),user=session?.user;if(user&&user.email?.toLowerCase()===ADMIN_EMAIL){$("loginPanel").classList.add("hidden");$("appPanel").classList.remove("hidden");$("signedInAs").textContent="Signed in as "+user.email;loadPosts()}else{$("appPanel").classList.add("hidden");$("loginPanel").classList.remove("hidden");if(user)await client.auth.signOut()}}
client.auth.onAuthStateChange(()=>setTimeout(refreshSession,0));
$("signOut").onclick=async()=>{await client.auth.signOut();location.reload()};
$("newPost").onclick=()=>{["postId","title","slug","excerpt","content","cover"].forEach(id=>$(id).value="");$("status").value="draft";$("formHeading").textContent="New journal entry";say("")};
async function loadPosts(){const {data,error}=await client.from("journal_posts").select("*").order("created_at",{ascending:false});if(error){$("postsList").textContent=error.message;return}$("postsList").innerHTML="";if(!data.length){$("postsList").textContent="No entries yet.";return}data.forEach(p=>{const row=document.createElement("div");row.className="post";const info=document.createElement("div"),title=document.createElement("strong"),meta=document.createElement("small");title.textContent=p.title;meta.textContent=" · "+p.status;info.append(title,meta);const edit=document.createElement("button");edit.className="secondary";edit.textContent="Edit";edit.onclick=()=>editPost(p);const del=document.createElement("button");del.className="secondary";del.textContent="Delete";del.onclick=()=>deletePost(p.id);row.append(info,edit,del);$("postsList").append(row)})}
function editPost(p){$("postId").value=p.id;$("title").value=p.title||"";$("slug").value=p.slug||"";$("excerpt").value=p.excerpt||"";$("content").value=p.content||"";$("cover").value=p.cover_image_url||"";$("status").value=p.status||"draft";$("formHeading").textContent="Edit journal entry";say("");window.scrollTo({top:0,behavior:"smooth"})}
$("savePost").onclick=async()=>{say("Saving…");const title=$("title").value.trim(),slug=$("slug").value.trim()||slugify(title),status=$("status").value;if(!title||!slug||!$("content").value.trim()){say("Please add a title, slug, and article content.");return}const payload={title,slug,excerpt:$("excerpt").value.trim(),content:$("content").value.trim(),cover_image_url:$("cover").value.trim()||null,status,published_at:status==="published"?new Date().toISOString():null,updated_at:new Date().toISOString()};let result=$("postId").value?await client.from("journal_posts").update(payload).eq("id",$("postId").value):await client.from("journal_posts").insert(payload);if(result.error){say(result.error.message);return}say(status==="published"?"Published successfully.":"Draft saved.");$("newPost").click();await loadPosts()};
async function deletePost(id){if(!confirm("Delete this journal entry permanently?"))return;const {error}=await client.from("journal_posts").delete().eq("id",id);if(error)say(error.message);else{say("Entry deleted.");loadPosts()}}
refreshSession();
</script></body></html>
